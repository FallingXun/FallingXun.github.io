 width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="322" y="425" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="360" y="425" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="398" y="425" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="132" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="170" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="208" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="246" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="284" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="322" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="360" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="398" y="463" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="132" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="170" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="208" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="246" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="284" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="322" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="360" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><rect x="398" y="501" width="36" height="36" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" opacity="1"/><circle cx="170" cy="273" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="182" y="278" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G00</text><circle cx="246" cy="273" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="258" y="278" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G01</text><circle cx="322" cy="273" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="334" y="278" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G02</text><circle cx="398" cy="273" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="410" y="278" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G03</text><circle cx="170" cy="349" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="182" y="354" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G10</text><circle cx="246" cy="349" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="258" y="354" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G11</text><circle cx="322" cy="349" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="334" y="354" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G12</text><circle cx="398" cy="349" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="410" y="354" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G13</text><circle cx="170" cy="425" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="182" y="430" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G20</text><circle cx="246" cy="425" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="258" y="430" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G21</text><circle cx="322" cy="425" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="334" y="430" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G22</text><circle cx="398" cy="425" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="410" y="430" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G23</text><circle cx="170" cy="501" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="182" y="506" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G30</text><circle cx="246" cy="501" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="258" y="506" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G31</text><circle cx="322" cy="501" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="334" y="506" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G32</text><circle cx="398" cy="501" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/><text x="410" y="506" fill="#2563eb" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">G33</text><rect x="249" y="352" width="30" height="30" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="3" opacity="1"/><text x="265.0" y="341" fill="#d97706" font-size="11" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">texel (3,3)</text><text x="292" y="565" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">● = 一个网格权重    □ = 一个 texel</text><rect x="565" y="135" width="580" height="465" rx="18" fill="#ffffff" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="592" y="175" fill="#172033" font-size="21" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">双线性插值示例</text><text x="592" y="202" fill="#64748b" font-size="14" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">texel (3,3) 落在网格坐标 (1.25, 1.25)</text><circle cx="670" cy="285" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="670" y="291" fill="#2563eb" font-size="11" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">G11</text><circle cx="820" cy="285" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="820" y="291" fill="#2563eb" font-size="11" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">G12</text><circle cx="670" cy="415" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="670" y="421" fill="#2563eb" font-size="11" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">G21</text><circle cx="820" cy="415" r="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="820" y="421" fill="#2563eb" font-size="11" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">G22</text><rect x="648" y="245" width="44" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="1"/><text x="670" y="260" fill="#d97706" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">0.75</text><rect x="798" y="245" width="44" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="1"/><text x="820" y="260" fill="#d97706" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">0.25</text><rect x="648" y="375" width="44" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="1"/><text x="670" y="390" fill="#d97706" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">0.25</text><rect x="798" y="375" width="44" height="20" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="1"/><text x="820" y="390" fill="#d97706" font-size="10" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">0.75</text><text x="855" y="270" fill="#64748b" font-size="12" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">x 方向</text><text x="608" y="337" fill="#64748b" font-size="12" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">y</text><text x="608" y="392" fill="#64748b" font-size="12" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">方向</text><text x="592" y="448" fill="#172033" font-size="17" font-weight="500" font-family="Cascadia Mono, Consolas, monospace"><tspan x="592" dy="0">w = 0.75 × 0.75 × G11</tspan><tspan x="592" dy="27">  + 0.75 × 0.25 × G12</tspan><tspan x="592" dy="27">  + 0.25 × 0.75 × G21</tspan><tspan x="592" dy="27">  + 0.25 × 0.25 × G22</tspan></text><text x="592" y="575" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">解码器对块内每个 texel 都做一次插值；相邻 texel 共享网格点，因此权重平滑过渡。</text><rect x="55" y="625" width="1090" height="55" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" opacity="1"/><text x="78" y="658" fill="#047857" font-size="14" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">小块的网格可以等于块尺寸（每个 texel 一个权重）；大块则必须/通常把网格缩减，以把权重位放进 128 bit。</text>
</svg>
