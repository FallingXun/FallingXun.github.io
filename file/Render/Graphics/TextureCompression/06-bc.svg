<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="705" viewBox="0 0 1200 705" role="img" aria-label="BC 家族编码与解码">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1200" height="705" fill="#ffffff"/>
<text x="55" y="60" fill="#172033" font-size="32" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC：桌面 GPU 的块压缩家族</text><text x="55" y="94" fill="#64748b" font-size="18" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC 系列以固定 4×4 块为基础，颜色块通常 64 bit，RGBA/高动态范围格式使用 128 bit。</text><rect x="55" y="135" width="520" height="335" rx="18" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="78" y="172" fill="#172033" font-size="19" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC1 / DXT1：64 bit，4×4，RGB 4 bpp</text><rect x="78" y="205" width="170" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="163.0" y="233" fill="#2563eb" font-size="13" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Endpoint 0</text><text x="163.0" y="254" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">RGB565 · 16 bit</text><rect x="258" y="205" width="170" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="343.0" y="233" fill="#2563eb" font-size="13" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Endpoint 1</text><text x="343.0" y="254" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">RGB565 · 16 bit</text><rect x="438" y="205" width="108" height="66" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" opacity="1"/><text x="492.0" y="233" fill="#ea580c" font-size="13" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Indices</text><text x="492.0" y="254" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">2 bit × 16</text><text x="78" y="310" fill="#64748b" font-size="14" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">解码：在 E0 和 E1 之间做 2-bit 索引的线性插值。</text><text x="78" y="342" fill="#2563eb" font-size="15" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">C0 = E0，C1 = E1</text><text x="78" y="369" fill="#2563eb" font-size="15" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">C2 = 2/3 E0 + 1/3 E1</text><text x="78" y="396" fill="#2563eb" font-size="15" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">C3 = 1/3 E0 + 2/3 E1</text><text x="78" y="431" fill="#64748b" font-size="12" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">特殊端点顺序可提供 1-bit alpha / 透明模式。</text><rect x="600" y="135" width="545" height="335" rx="18" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="623" y="172" fill="#172033" font-size="19" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC3 / BC7：128 bit，4×4，RGBA 8 bpp</text><rect x="623" y="205" width="240" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="743.0" y="233" fill="#2563eb" font-size="13" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">颜色块</text><text x="743.0" y="254" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">64 bit</text><rect x="873" y="205" width="240" height="66" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" opacity="1"/><text x="993.0" y="233" fill="#e11d48" font-size="13" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Alpha / 模式块</text><text x="993.0" y="254" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">64 bit</text><text x="623" y="310" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC3：颜色块用 BC1 逻辑，Alpha 块存两个 8-bit 端点 + 16 个 3-bit 索引。</text><text x="623" y="338" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC7：128 bit 内有 8 种模式，可选 0–3 个分区，端点和索引位宽可变。</text><text x="623" y="370" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC6H：同尺寸，面向 HDR RGB，使用半精度端点和分区模式。</text><text x="623" y="408" fill="#2563eb" font-size="14" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">解码核心仍然是：端点 + 分区 + 每 texel 索引/权重。</text><text x="623" y="436" fill="#64748b" font-size="12" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">但 BC7 的模式搜索明显更复杂，编码质量也更高。</text><rect x="55" y="510" width="248" height="65" rx="10" fill="#2563eb12" stroke="#2563eb" stroke-width="1.1" opacity="1"/><text x="68" y="534" fill="#2563eb" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC1</text><text x="68" y="553" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">RGB / 1-bit alpha</text><text x="291" y="553" fill="#2563eb" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">64 bit · 4 bpp</text><rect x="327" y="510" width="248" height="65" rx="10" fill="#0f766e12" stroke="#0f766e" stroke-width="1.1" opacity="1"/><text x="340" y="534" fill="#0f766e" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC2</text><text x="340" y="553" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">RGB + 4-bit alpha</text><text x="563" y="553" fill="#0f766e" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">128 bit · 8 bpp</text><rect x="599" y="510" width="248" height="65" rx="10" fill="#ea580c12" stroke="#ea580c" stroke-width="1.1" opacity="1"/><text x="612" y="534" fill="#ea580c" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC3</text><text x="612" y="553" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">RGB + smooth alpha</text><text x="835" y="553" fill="#ea580c" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">128 bit · 8 bpp</text><rect x="871" y="510" width="248" height="65" rx="10" fill="#7c3aed12" stroke="#7c3aed" stroke-width="1.1" opacity="1"/><text x="884" y="534" fill="#7c3aed" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC4</text><text x="884" y="553" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">单通道</text><text x="1107" y="553" fill="#7c3aed" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">64 bit · 4 bpp</text><rect x="55" y="592" width="248" height="65" rx="10" fill="#e11d4812" stroke="#e11d48" stroke-width="1.1" opacity="1"/><text x="68" y="616" fill="#e11d48" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC5</text><text x="68" y="635" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">双通道 / 法线</text><text x="291" y="635" fill="#e11d48" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">128 bit · 8 bpp</text><rect x="327" y="592" width="248" height="65" rx="10" fill="#d9770612" stroke="#d97706" stroke-width="1.1" opacity="1"/><text x="340" y="616" fill="#d97706" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC6H</text><text x="340" y="635" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">HDR RGB</text><text x="563" y="635" fill="#d97706" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">128 bit · 8 bpp</text><rect x="599" y="592" width="248" height="65" rx="10" fill="#16a34a12" stroke="#16a34a" stroke-width="1.1" opacity="1"/><text x="612" y="616" fill="#16a34a" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">BC7</text><text x="612" y="635" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">高质量 RGBA</text><text x="835" y="635" fill="#16a34a" font-size="9" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">128 bit · 8 bpp</text><rect x="55" y="655" width="1090" height="32" rx="10" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="600" y="676" fill="#64748b" font-size="12" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">BC 主要面向 DirectX / 桌面 GPU；移动端支持取决于 GPU、图形 API 和压缩格式能力。</text>
</svg>
