a Mono, Consolas, monospace" text-anchor="middle" opacity="1">4</text><rect x="864" y="297" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5" opacity="1"/><text x="874" y="312" fill="#2563eb" font-size="11" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">5</text><rect x="888" y="297" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5" opacity="1"/><text x="898" y="312" fill="#2563eb" font-size="11" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">6</text><rect x="912" y="297" width="20" height="20" rx="4" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5" opacity="1"/><text x="922" y="312" fill="#2563eb" font-size="11" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">7</text><text x="903" y="335" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">量化成 2–6 bit / 值</text><line x1="1011" y1="245" x2="1051" y2="245" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="1058" y="135" width="100" height="225" rx="16" fill="#0f172a" stroke="#0f172a" stroke-width="1.5" opacity="1"/><text x="1108" y="170" fill="#f8fafc" font-size="18" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">⑤ 打包</text><text x="1108" y="214" fill="#93c5fd" font-size="34" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">128</text><text x="1108" y="242" fill="#a7b4c8" font-size="15" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">bit</text><text x="1108" y="300" fill="#99f6e4" font-size="17" font-weight="700" font-family="Cascadia Mono, Consolas, monospace" text-anchor="middle" opacity="1">16 B</text><text x="1108" y="326" fill="#a7b4c8" font-size="12" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">每块</text><rect x="55" y="425" width="1090" height="135" rx="16" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="78" y="460" fill="#172033" font-size="18" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ASTC 块的通用逻辑结构</text><text x="78" y="485" fill="#64748b" font-size="14" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">具体字段数量和排列由 Block Mode 决定；下图表示解码器需要理解的语义，而不是唯一的物理布局。</text><rect x="78" y="515" width="180" height="26" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="88" y="533" fill="#2563eb" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">Block Mode</text><text x="248" y="533" fill="#2563eb" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="end" opacity="1">尺寸/分区/网格</text><rect x="270" y="515" width="300" height="26" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" opacity="1"/><text x="280" y="533" fill="#7c3aed" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">配置与分区</text><text x="560" y="533" fill="#7c3aed" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="end" opacity="1">partition / plane</text><rect x="582" y="515" width="260" height="26" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5" opacity="1"/><text x="592" y="533" fill="#0f766e" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">端点</text><text x="832" y="533" fill="#0f766e" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="end" opacity="1">量化颜色</text><rect x="854" y="515" width="270" height="26" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" opacity="1"/><text x="864" y="533" fill="#ea580c" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">权重网格</text><text x="1114" y="533" fill="#ea580c" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="end" opacity="1">2–6 bit / 值</text><rect x="55" y="590" width="1090" height="72" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" opacity="1"/><text x="80" y="621" fill="#1d4ed8" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">解码公式</text><text x="185" y="621" fill="#1e3a8a" font-size="17" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="True" opacity="1">color(texel) = Endpoint0 + w(texel) / (2ⁿ−1) × (Endpoint1 − Endpoint0)</text><text x="80" y="646" fill="#475569" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">其中 w(texel) 由权重网格按位置双线性插值得到；n 是每个权重值的位数。</text>
