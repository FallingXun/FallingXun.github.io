<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="ETC 编码与解码">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<rect width="1200" height="780" fill="#ffffff"/>
<text x="55" y="60" fill="#172033" font-size="32" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ETC：两个子块、少量基色和调制表</text><text x="55" y="94" fill="#64748b" font-size="18" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ETC1/ETC2 以固定 4×4 块为核心；ETC1 为 64 bit，ETC2 增加差分解码、T/H/Planar 和 EAC 透明通道。</text><rect x="55" y="135" width="1090" height="205" rx="18" fill="#f8fafc" stroke="#dbe4ee" stroke-width="1.5" opacity="1"/><text x="78" y="172" fill="#172033" font-size="20" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ETC1：64 bit / 4×4 块（RGB，4 bpp）</text><rect x="88" y="200" width="140" height="104" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" opacity="1"/><line x1="158" y1="200" x2="158" y2="304" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 4"/><text x="158" y="326" fill="#2563eb" font-size="12" font-weight="600" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">flip：2×4 或 4×2 子块</text><text x="88" y="358" fill="#64748b" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">每个子块：基色 + table codeword + 16 个 2-bit index</text><rect x="300" y="205" width="150" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="375.0" y="231" fill="#2563eb" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Base Color 0</text><text x="375.0" y="251" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">RGB 4/4/4</text><rect x="470" y="205" width="150" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="1"/><text x="545.0" y="231" fill="#2563eb" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Base Color 1</text><text x="545.0" y="251" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">RGB 4/4/4</text><rect x="640" y="205" width="150" height="62" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" opacity="1"/><text x="715.0" y="231" fill="#7c3aed" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Modifier Table</text><text x="715.0" y="251" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">3 bit × 2</text><rect x="810" y="205" width="260" height="62" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" opacity="1"/><text x="940.0" y="231" fill="#ea580c" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Pixel Indices</text><text x="940.0" y="251" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">2 bit × 16</text><rect x="1085" y="205" width="35" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" opacity="1"/><text x="1102.5" y="231" fill="#64748b" font-size="12" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">Flag</text><text x="1102.5" y="251" fill="#64748b" font-size="10" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="middle" opacity="1">2 bit</text><text x="1065" y="296" fill="#64748b" font-size="11" font-weight="500" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="end" opacity="1">1 flip + 1 diff</text><text x="1058" y="317" fill="#2563eb" font-size="12" font-weight="600" font-family="Cascadia Mono, Consolas, monospace" text-anchor="end" opacity="1">64 bit total</text><rect x="55" y="370" width="1090" height="82" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" opacity="1"/><text x="78" y="402" fill="#1d4ed8" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ETC1 解码公式</text><text x="225" y="402" fill="#1e3a8a" font-size="18" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">color(texel) = BaseColor[subblock] + Modifier[table][index(texel)]</text><text x="78" y="431" fill="#475569" font-size="13" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">每个像素只携带 2 bit 索引，因此子块内的颜色只能沿调制表给出的少量明暗台阶变化。</text><text x="55" y="505" fill="#172033" font-size="21" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">ETC2 的扩展模式</text><rect x="55" y="535" width="330" height="85" rx="12" fill="#dbeafe66" stroke="#2563eb" stroke-width="1.2" opacity="1"/><text x="70" y="562" fill="#2563eb" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">Individual / Differential</text><text x="70" y="587" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">子块基色独立，或第二个基色用 3-bit 有符号差值</text><text x="70" y="605" fill="#2563eb" font-size="10" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">64 bit</text><rect x="420" y="535" width="330" height="85" rx="12" fill="#ccfbf166" stroke="#0f766e" stroke-width="1.2" opacity="1"/><text x="435" y="562" fill="#0f766e" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">T 模式</text><text x="435" y="587" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">两个端点 + 一个中间色，适合双色/边缘</text><text x="435" y="605" fill="#0f766e" font-size="10" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">64 bit</text><rect x="785" y="535" width="330" height="85" rx="12" fill="#ede9fe66" stroke="#7c3aed" stroke-width="1.2" opacity="1"/><text x="800" y="562" fill="#7c3aed" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">H 模式</text><text x="800" y="587" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">两个端点派生的多级明暗，适合渐变</text><text x="800" y="605" fill="#7c3aed" font-size="10" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">64 bit</text><rect x="55" y="640" width="330" height="85" rx="12" fill="#ffedd566" stroke="#ea580c" stroke-width="1.2" opacity="1"/><text x="70" y="667" fill="#ea580c" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">Planar 模式</text><text x="70" y="692" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">用一个基色和两个斜率表示平滑平面</text><text x="70" y="710" fill="#ea580c" font-size="10" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">64 bit</text><rect x="420" y="640" width="330" height="85" rx="12" fill="#ffe4e666" stroke="#e11d48" stroke-width="1.2" opacity="1"/><text x="435" y="667" fill="#e11d48" font-size="15" font-weight="700" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">EAC 透明通道</text><text x="435" y="692" fill="#64748b" font-size="11" font-weight="400" font-family="Microsoft YaHei, Noto Sans CJK SC, Segoe UI, Arial, sans-serif" text-anchor="start" opacity="1">单独 64-bit 通道块，基值 + 倍数 + 索引</text><text x="435" y="710" fill="#e11d48" font-size="10" font-weight="500" font-family="Cascadia Mono, Consolas, monospace" text-anchor="start" opacity="1">64 bit</text>
</svg>
